[package]
name = "santroller-configurator"
version = "0.1.0"
description = "Santroller Configurator"
authors = ["Sanjay Govind"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "santroller_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-lite = "2"
# Not seized on macOS, the same as browsers open it
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }
nusb = "0.2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Web inspector in release builds, for test builds sent to users (right click -> Inspect Element)
devtools = ["tauri/devtools"]
# The standalone exe offered alongside the Windows installers, which updates itself in place
portable = []
