# Builds the firmware the configurator ships with, and then the configurator itself, into dist/.
# Expects the repo to be checked out with its submodules.
name: Build configurator
description: Build the firmware images and the web configurator

outputs:
  version:
    description: The configurator's version, see scripts/version.mjs
    value: ${{ steps.version.outputs.version }}

inputs:
  arm-toolchain-version:
    default: '15.2.Rel1'
  pico-sdk-tools-tag:
    default: 'v2.3.1-0'
  picotool-version:
    default: '2.3.1'
  pico-sdk-tools-version:
    default: '2.3.1'

runs:
  using: composite
  steps:
    # The configurator's version and the firmware's build number count commits, which a shallow
    # clone doesn't have. Only the firmware itself needs it, not its own submodules.
    - name: Fetch the git history
      shell: bash
      run: |
        # Without --recurse-submodules=no git also fetches every submodule touched anywhere in the
        # history it just got, including ones that aren't checked out
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --unshallow --quiet --recurse-submodules=no
        fi
        if [ "$(git -C Santroller rev-parse --is-shallow-repository)" = true ]; then
          git -C Santroller fetch --unshallow --quiet --recurse-submodules=no
        fi
    - name: Change Mirror Priorities
      shell: bash
      run: |
        sudo sed -i '/archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:2/priority:0/' /etc/apt/apt-mirrors.txt
        sudo sed -i '/azure.archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:0/priority:1/' /etc/apt/apt-mirrors.txt
        sudo sed -i '/security.ubuntu.com\/ubuntu\/\tpriority/ s/priority:3/priority:2/' /etc/apt/apt-mirrors.txt
        sudo cat /etc/apt/apt-mirrors.txt
    - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: ${{ inputs.arm-toolchain-version }}
    - name: Install Pico SDK Tools from pico-sdk-tools
      shell: bash
      env:
        PICO_SDK_TOOLS_TAG: ${{ inputs.pico-sdk-tools-tag }}
        PICOTOOL_VERSION: ${{ inputs.picotool-version }}
        PICO_SDK_TOOLS_VERSION: ${{ inputs.pico-sdk-tools-version }}
      run: |
        TOOLS_DIR="$RUNNER_TEMP/pico-sdk-tools"
        mkdir -p "$TOOLS_DIR/picotool" "$TOOLS_DIR/pioasm"
        curl -sL "https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICO_SDK_TOOLS_TAG}/picotool-${PICOTOOL_VERSION}-x86_64-lin.tar.gz" | tar -xz -C "$TOOLS_DIR/picotool"
        curl -sL "https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICO_SDK_TOOLS_TAG}/pico-sdk-tools-${PICO_SDK_TOOLS_VERSION}-x86_64-lin.tar.gz" | tar -xz -C "$TOOLS_DIR/pioasm"
        echo "$TOOLS_DIR/picotool/picotool" >> $GITHUB_PATH
        echo "$TOOLS_DIR/pioasm/pioasm" >> $GITHUB_PATH
        echo "picotool_DIR=$TOOLS_DIR/picotool/picotool" >> $GITHUB_ENV
        echo "pioasm_DIR=$TOOLS_DIR/pioasm/pioasm" >> $GITHUB_ENV
    # build-essential and make come with the runner, so only update the package lists if
    # cabextract can't be installed without
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get install -y cabextract || { sudo apt-get update && sudo apt-get install -y cabextract; }
    # The firmware builds against the SDK's master branch, so only download it again when master
    # has moved. pico_sdk_import.cmake uses PICO_SDK_PATH instead of fetching it itself.
    - name: Find the Pico SDK commit
      id: sdk
      shell: bash
      run: echo "sha=$(git ls-remote https://github.com/raspberrypi/pico-sdk refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache the Pico SDK
      id: sdk-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/pico-sdk
        key: pico-sdk-${{ steps.sdk.outputs.sha }}
    - name: Download the Pico SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SHA: ${{ steps.sdk.outputs.sha }}
      run: |
        SDK="$RUNNER_TEMP/pico-sdk"
        git init -q "$SDK"
        git -C "$SDK" fetch -q --depth 1 https://github.com/raspberrypi/pico-sdk "$SHA"
        git -C "$SDK" checkout -q FETCH_HEAD
        git -C "$SDK" submodule update -q --init --depth 1
        # the build doesn't need the history, and leaving it out keeps the cache smaller
        find "$SDK" -name .git -prune -exec rm -rf {} +
    - name: Use the Pico SDK
      shell: bash
      run: echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
    # Most commits only touch a few files, so reuse what earlier runs compiled. The firmware's
    # CMakeLists.txt compiles through ccache whenever it is installed.
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: firmware
        max-size: 500M
        # its own save runs as a post step even when the job is cancelled mid-build, and a cache
        # saved then had objects under the wrong sources, breaking every later link. Save it below
        # instead, which only happens once the build has succeeded
        save: false
    - name: Configure ccache
      shell: bash
      run: |
        # paths in the workspace are the same every run, but the compiler is installed fresh each
        # time, so check what it is rather than when it was installed
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'yarn'
    - name: Install dependencies
      shell: bash
      run: yarn
    - name: Build
      shell: bash
      run: yarn build
    - name: Show how much ccache saved
      shell: bash
      run: ccache --show-stats
    # restoring matches on the ccache-firmware- prefix and takes the newest
    - name: Save ccache
      if: success()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-firmware-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Work out the version
      id: version
      shell: bash
      run: echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"
