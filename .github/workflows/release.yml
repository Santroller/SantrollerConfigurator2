# On every push to main: builds the configurator once, deploys it to GitHub Pages, and releases the
# desktop app for Linux, Windows and macOS around that same build, versioned by
# scripts/version.mjs. The desktop release is built as a draft and only published once every
# platform built.
name: Deploy and release

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Each job asks for what it needs
permissions: {}

# A newer push replaces a run that is still going, so an older build can't end up deployed or
# released as latest
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # The configurator and the firmware it ships only need building once, on linux, as the desktop
  # builds just wrap them
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build
        id: build
        uses: ./.github/actions/build-web
      - name: Upload configurator
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The draft is created once here, not by each platform: tauri-action looks for drafts in the
  # release list, which lags behind, so two platforms finishing together would each create one
  release:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      # A re-run of the same commit picks up the draft it left behind
      - name: Create the draft release
        id: draft
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="v$VERSION" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Santroller Configurator $VERSION" \
              -f body="Built from $GITHUB_SHA. See the assets below to download and install it." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [web, release]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # the oldest supported ubuntu, so the .deb and AppImage run on older distros too
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The frontend comes from the web job, so there's nothing to build before bundling. Releases
      # are signed for the updater, which local builds don't need.
      - name: Configure the release
        shell: bash
        run: |
          echo "{\"version\": \"$VERSION\", \"build\": {\"beforeBuildCommand\": \"\"}, \"bundle\": {\"createUpdaterArtifacts\": true}}" > src-tauri/tauri.release.conf.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Download configurator
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the updates, the app only installs ones signed with this key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: yarn tauri
          # latest.json is written once by the publish job: platforms finishing together would
          # each replace it, so one would fail or lose another's entry
          includeUpdaterJson: false
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      # The exe on its own, for people who'd rather not install it. Built with the portable feature so
      # it updates itself rather than installing the msi next to it, and signed so it can.
      - name: Build and upload the portable exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
        run: |
          yarn tauri build --no-bundle --features portable --config src-tauri/tauri.release.conf.json
          name="Santroller.Configurator_${VERSION}_x64_portable.exe"
          cp src-tauri/target/release/santroller-configurator.exe "$name"
          yarn tauri signer sign --app-version "$VERSION" "$name"
          upload=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url | sub("\\{.*"; "")')
          # replaces ones left by an earlier attempt at this release
          for file in "$name" "$name.sig"; do
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$file\") | .id")
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST "$upload?name=$file" -H 'Content-Type: application/octet-stream' \
              --input "$file" --silent
          done

  publish:
    needs: [web, release, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      # The app checks latest.json for updates. Every bundle and its signature has to be on the
      # release, so a platform that didn't upload fails here rather than being left out.
      - name: Write the updater manifest
        run: |
          gh api "$RELEASE" > release.json
          # links to the tag rather than the draft's untagged-* url, so they work once published
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          platforms='{}'
          # adds each platform key to the manifest, pointing at the one bundle whose name matches
          add() {
            local pattern=$1 name sig_url signature
            shift
            name=$(jq -r --arg re "$pattern" '[.assets[] | select(.name | test($re))]
              | if length == 1 then .[0].name
                else error("expected one asset matching \($re), found \(length)") end' release.json)
            sig_url=$(jq -r --arg n "$name.sig" '.assets[] | select(.name == $n) | .url' release.json)
            [ -n "$sig_url" ] || { echo "$name has no signature"; exit 1; }
            signature=$(gh api -H 'Accept: application/octet-stream' "$sig_url")
            for key in "$@"; do
              platforms=$(jq --arg k "$key" --arg s "$signature" --arg u "$download/$name" \
                '.[$k] = {signature: $s, url: $u}' <<< "$platforms")
            done
          }
          add '\.AppImage$' linux-x86_64 linux-x86_64-appimage
          add '\.deb$' linux-x86_64-deb
          add '\.rpm$' linux-x86_64-rpm
          add '\.msi$' windows-x86_64 windows-x86_64-msi
          add '-setup\.exe$' windows-x86_64-nsis
          add '_portable\.exe$' windows-x86_64-portable
          add '\.app\.tar\.gz$' darwin-x86_64 darwin-aarch64 darwin-x86_64-app darwin-aarch64-app
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "", pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
          # replaces one left by an earlier attempt at this release
          old=$(jq -r '.assets[] | select(.name == "latest.json") | .id' release.json)
          [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          upload=$(jq -r '.upload_url | sub("\\{.*"; "")' release.json)
          gh api -X POST "$upload?name=latest.json" -H 'Content-Type: application/json' \
            --input latest.json --silent
      - name: Publish the release
        run: gh api -X PATCH "$RELEASE" -F draft=false -f make_latest=true --silent
      # Runs cancelled by a newer push leave their drafts behind. Only drafts created before this
      # one are removed, in case a newer run has already made its own.
      - name: Discard older drafts
        run: |
          created=$(gh api "$RELEASE" --jq .created_at)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .created_at < \"$created\") | \"\(.id) \(.tag_name)\"" |
            while read -r id tag; do
              echo "Deleting draft $tag ($id)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
