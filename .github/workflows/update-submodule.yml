name: Update Santroller Submodule

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: update-santroller-submodule
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule to latest
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git submodule update --remote Santroller
          git add Santroller
          git commit -m "Update Santroller submodule to latest main" || echo "No changes to commit"
          git push origin update-santroller-submodule

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:update-santroller-submodule`,
              base: 'main',
              state: 'open'
            });
            
            if (pulls.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Update Santroller submodule to latest main',
                head: 'update-santroller-submodule',
                base: 'main',
                body: 'This PR updates the Santroller submodule to the latest commit on main.\n\nGenerated by workflow.'
              });
            }
