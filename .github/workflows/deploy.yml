# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  ARM_TOOLCHAIN_VERSION: '15.2.Rel1'
  PICO_SDK_TOOLS_TAG: 'v2.3.1-0'
  PICOTOOL_VERSION: '2.3.1'
  PICO_SDK_TOOLS_VERSION: '2.3.1'

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Change Mirror Priorities
        shell: bash
        run: |
          sudo sed -i '/archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:2/priority:0/' /etc/apt/apt-mirrors.txt
          sudo sed -i '/azure.archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:0/priority:1/' /etc/apt/apt-mirrors.txt
          sudo sed -i '/security.ubuntu.com\/ubuntu\/\tpriority/ s/priority:3/priority:2/' /etc/apt/apt-mirrors.txt
          sudo cat /etc/apt/apt-mirrors.txt
      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.ARM_TOOLCHAIN_VERSION }}
      - name: Install Pico SDK Tools from pico-sdk-tools
        run: |
          TOOLS_DIR="$RUNNER_TEMP/pico-sdk-tools"
          mkdir -p "$TOOLS_DIR/picotool" "$TOOLS_DIR/pioasm"
          curl -sL "https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICO_SDK_TOOLS_TAG}/picotool-${PICOTOOL_VERSION}-x86_64-lin.tar.gz" | tar -xz -C "$TOOLS_DIR/picotool"
          curl -sL "https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICO_SDK_TOOLS_TAG}/pico-sdk-tools-${PICO_SDK_TOOLS_VERSION}-x86_64-lin.tar.gz" | tar -xz -C "$TOOLS_DIR/pioasm"
          echo "$TOOLS_DIR/picotool/picotool" >> $GITHUB_PATH
          echo "$TOOLS_DIR/pioasm/pioasm" >> $GITHUB_PATH
          echo "picotool_DIR=$TOOLS_DIR/picotool/picotool" >> $GITHUB_ENV
          echo "pioasm_DIR=$TOOLS_DIR/pioasm/pioasm" >> $GITHUB_ENV
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install build-essential make cabextract
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'yarn'
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4